name: Release OCR Addon

on:
  push:
    tags:
      - 'ocr-addon-*'

permissions:
  contents: write

jobs:
  build-macos-arm64:
    name: Build OCR Addon macOS arm64
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Extract version from tag
        id: version
        run: |
          TAG=${GITHUB_REF_NAME#ocr-addon-}
          echo "VERSION=$TAG" >> $GITHUB_OUTPUT

      - name: Run packaging script
        run: chmod +x scripts/package-ocr-addon.sh && ./scripts/package-ocr-addon.sh macos arm64 ${{ steps.version.outputs.VERSION }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ocr-addon-macos-arm64
          path: dist/paddleocr-addon-${{ steps.version.outputs.VERSION }}-macos-arm64.zip

  build-macos-x86_64:
    name: Build OCR Addon macOS x86_64
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Extract version from tag
        id: version
        run: |
          TAG=${GITHUB_REF_NAME#ocr-addon-}
          echo "VERSION=$TAG" >> $GITHUB_OUTPUT

      - name: Run packaging script
        run: chmod +x scripts/package-ocr-addon.sh && ./scripts/package-ocr-addon.sh macos x86_64 ${{ steps.version.outputs.VERSION }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ocr-addon-macos-x86_64
          path: dist/paddleocr-addon-${{ steps.version.outputs.VERSION }}-macos-x86_64.zip

  build-windows-x64:
    name: Build OCR Addon Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Extract version from tag
        id: version
        shell: bash
        run: |
          TAG=${GITHUB_REF_NAME#ocr-addon-}
          echo "VERSION=$TAG" >> $GITHUB_OUTPUT

      - name: Run packaging script
        shell: bash
        run: chmod +x scripts/package-ocr-addon.sh && ./scripts/package-ocr-addon.sh windows x64 ${{ steps.version.outputs.VERSION }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ocr-addon-windows-x64
          path: dist/paddleocr-addon-${{ steps.version.outputs.VERSION }}-windows-x64.zip

  release:
    name: Create OCR Addon Release
    needs: [build-macos-arm64, build-macos-x86_64, build-windows-x64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: |
          TAG=${GITHUB_REF_NAME#ocr-addon-}
          echo "VERSION=$TAG" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Move artifacts to release root
        run: |
          mkdir -p release-assets
          find artifacts -name "*.zip" -exec cp {} release-assets/ \;

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*.zip
          name: OCR Addon ${{ steps.version.outputs.VERSION }}
          generate_release_notes: true
